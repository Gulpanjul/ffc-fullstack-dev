<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="business-card">
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
        alt="image"
        class="profile-image"
      />
      <p class="full-name">Lorem, ipsum.</p>
      <p class="designation">
        <em>Front End Developer</em>
      </p>
      <p class="company">
        <em>freecodecamp.org</em>
      </p>
      <hr />
      <p>email@mail.com</p>
      <p>(+00) 000-0000</p>
      <a href="https://freecodecamp.org">Portfolio</a>
      <hr />
      <div class="social-media">
        <h2>Connect with me</h2>
        <a href="https://freecodecamp.org">Twitter</a>
        <a href="https://freecodecamp.org">LinkedIn</a>
        <a href="https://freecodecamp.org">GitHub</a>
      </div>
    </div>
  </body>
</html>
