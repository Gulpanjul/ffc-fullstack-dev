<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimedia Player</title>
  </head>

  <body>
    <h1>Multimedia Player</h1>
    <section>
      <h2>MP3</h2>
      <audio controls aria-label="MP3">
        <source
          src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
          type="audio/mpeg"
        />
      </audio>
    </section>
    <section>
      <h2>Video</h2>
      <video controls width="400" aria-label="Video">
        <source
          src="https://cdn.freecodecamp.org/curriculum/labs/What is the map method and how does it work.mp4"
          type="video/mp4"
        />
        <track src="subtitles.vtt" kind="captions" srclang="en" label="English"></track>
      </video>
    </section>
    <section>
        <h2>Transcript</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Illo quas inventore voluptatum quam dignissimos dicta!</p>
    </section>
  </body>
</html>
